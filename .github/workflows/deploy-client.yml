name: Deploy client

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [server-updated]
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: caches/DH2
          key: dh2-${{ github.run_id }}
          restore-keys: dh2-
      - run: npm install
      - run: node build full
      - run: bash build-tools/check-build
        env:
          EXPECTED_SERVER_SHA: ${{ github.event.client_payload.server_sha }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find play.pokemonshowdown.com -name '*.php' -delete
          find play.pokemonshowdown.com -xtype l -delete
          npx --yes wrangler@4 pages deploy play.pokemonshowdown.com --project-name dystoria-client --branch main
